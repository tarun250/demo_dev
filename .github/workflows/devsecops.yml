name: Python DevSecOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:

  # ==========================================
  # 1. TEST
  # ==========================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest --cov=app --cov-report=term-missing


  # ==========================================
  # 2. SAST - STATIC APPLICATION SECURITY TEST
  # ==========================================
  sast:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3


  # ==========================================
  # 3. SCA - SOFTWARE COMPOSITION ANALYSIS
  # ==========================================
  sca:
    name: SCA - Dependency Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install pip-audit
        run: |
          pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit


  # ==========================================
  # 4. DOCKER BUILD
  # ==========================================
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - test
      - sast
      - sca

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t tarun250/python-webapp:${{ github.sha }} \
            -t tarun250/python-webapp:latest \
            .

      - name: Verify Docker image
        run: |
          docker images


  # ==========================================
  # 5. IMAGE SECURITY SCAN
  # ==========================================
  image-scan:
    name: Trivy Docker Image Scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image for scanning
        run: |
          docker build \
            -t tarun250/python-webapp:${{ github.sha }} \
            .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "tarun250/python-webapp:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"


  # ==========================================
  # 6. PUSH IMAGE TO DOCKER HUB
  # ==========================================
  push:
    name: Push Image to Docker Hub
    runs-on: ubuntu-latest
    needs:
      - image-scan

    # IMPORTANT:
    # Change "docker" if your GitHub Environment
    # has a different name.
    environment: docker

    # Push only when code is pushed to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: tarun250
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and tag image
        run: |
          docker build \
            -t tarun250/python-webapp:${{ github.sha }} \
            -t tarun250/python-webapp:latest \
            .

      - name: Push image with commit SHA
        run: |
          docker push tarun250/python-webapp:${{ github.sha }}

      - name: Push latest image
        run: |
          docker push tarun250/python-webapp:latest


  # ==========================================
  # 7. DEPLOY TO KUBERNETES
  # ==========================================
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs:
      - push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      # ======================================
      # IMPORTANT:
      # Your Kubernetes deployment.yaml
      # should contain:
      #
      # image: tarun250/python-webapp:__IMAGE_TAG__
      #
      # ======================================

      - name: Update image tag
        run: |
          sed -i "s|__IMAGE_TAG__|${{ github.sha }}|g" k8s/deployment.yaml

      - name: Show deployment file
        run: |
          cat k8s/deployment.yaml

      - name: Apply Kubernetes deployment
        run: |
          kubectl apply -f k8s/deployment.yaml

      - name: Apply Kubernetes service
        run: |
          kubectl apply -f k8s/service.yaml

      - name: Check deployment
        run: |
          kubectl rollout status deployment/python-webapp --timeout=60s

      - name: Check pods
        run: |
          kubectl get pods

      - name: Check services
        run: |
          kubectl get services